[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-explorer-demo-source"
version = "0.1.0"
description = "Demo data source plugin for Graph Explorer"
requires-python = ">=3.10"
dependencies = ["graph-explorer-api"]

[project.entry-points."graph_explorer.data_sources"]
demo = "graph_explorer_demo_source.plugin:DemoDataSource"

[tool.setuptools.packages.find]
where = ["src"]