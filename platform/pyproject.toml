[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-explorer-platform"
version = "0.1.0"
description = "Core platform for Graph Explorer"
requires-python = ">=3.10"
dependencies = ["graph-explorer-api"]

[tool.setuptools.packages.find]
where = ["src"]